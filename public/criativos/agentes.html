<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentes ao vivo · Criativos</title>
<style>
  :root { --bg:#0F1115; --card:#161A21; --line:#242A33; --tx:#E6E9EE; --mut:#8B95A3; --ok:#2EE59D; --bad:#FF5C5C; --warn:#FFD23F; --blue:#5B8CFF; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif }
  header { display:flex; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line) }
  header h1 { font-size:20px; margin:0; font-weight:600 } header .sub { color:var(--mut); font-size:13px } header a { color:var(--mut); margin-left:auto; text-decoration:none } header a:hover { color:var(--tx) }
  main { padding:24px 28px; display:grid; gap:20px; grid-template-columns: 1.2fr 1fr; max-width:1500px }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px }
  .box h2 { margin:0 0 12px; font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--mut) }
  .pipe { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px }
  .st { background:#0F1115; border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center } .st b { display:block; font-size:30px; font-weight:700; line-height:1 } .st span { color:var(--mut); font-size:12px }
  .st.on b { color:var(--ok) } .st.ask b { color:var(--warn) }
  .bar { height:14px; background:#0F1115; border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex } .bar i { display:block; height:100% } .bar .f { background:#2A313C } .bar .b { background:var(--blue); background-image:linear-gradient(90deg, rgba(255,255,255,.18) 0 50%, transparent 50% 100%); background-size:18px 100%; animation:mv 1s linear infinite } .bar .r { background:var(--warn) } .bar .a { background:var(--ok) } .bar .p { background:#8B5CF6 }
  @keyframes mv { to { background-position:18px 0 } }
  .leg { display:flex; gap:14px; color:var(--mut); font-size:12px; margin-top:8px; flex-wrap:wrap } .leg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px }
  .ag { display:grid; grid-template-columns:14px 180px 1fr auto; gap:12px; align-items:start; padding:10px 0; border-top:1px solid var(--line) } .ag:first-of-type { border-top:0 }
  .dot { width:10px; height:10px; border-radius:50%; background:#3A4250; margin-top:6px } .dot.on { background:var(--ok); box-shadow:0 0 0 0 rgba(46,229,157,.6); animation:pulse 1.4s infinite }
  @keyframes pulse { 70% { box-shadow:0 0 0 9px rgba(46,229,157,0) } 100% { box-shadow:0 0 0 0 rgba(46,229,157,0) } }
  .ag .n { font-weight:600 } .ag .n small { display:block; color:var(--mut); font-weight:400; font-size:12px } .ag .w { color:var(--mut); font-size:13px } .ag .w b { color:var(--tx); font-weight:500 } .ag .t { color:var(--mut); font-size:12px; text-align:right; white-space:nowrap }
  .typing { display:inline-block } .typing i { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ok); margin-right:3px; animation:tp 1.2s infinite } .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s} @keyframes tp { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  .rec { padding:9px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center } .rec:first-child { border-top:0 }
  .chip { font-size:11px; padding:2px 8px; border-radius:999px; background:#242A33; color:var(--tx); white-space:nowrap } .chip.hv{background:#1E3A5F;color:#9CC4FF} .chip.hf{background:#3B2F5F;color:#C9B3FF} .chip.body{background:#1E4A3A;color:#9CF5C9} .chip.angulo{background:#4A3A1E;color:#FFD9A0}
  .rec .id { font-weight:600; font-size:13px } .rec .hk { color:var(--mut); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .nota { font-weight:700; font-size:16px } .nota.g{color:var(--ok)} .nota.y{color:var(--warn)} .nota.r{color:var(--bad)}
  .log { font-size:12px; color:var(--mut); max-height:300px; overflow:auto } .log div { padding:5px 0; border-top:1px solid var(--line) } .log div:first-child { border-top:0 } .log b { color:var(--tx); font-weight:500 } .log .new { animation:fade 1.2s }
  @keyframes fade { from { background:rgba(46,229,157,.15) } to { background:transparent } }
  .wide { grid-column:1 / -1 } .muted { color:var(--mut) } #err { color:var(--bad); padding:20px 28px }
  @media (max-width:980px) { main { grid-template-columns:1fr } .pipe { grid-template-columns:repeat(3,1fr) } }
</style>
</head>
<body>
<header><h1>Agentes ao vivo</h1><span class="sub" id="hora">—</span><a href="/criativos/">← voltar ao app</a></header>
<div id="err" hidden></div>
<main id="main" hidden>
  <section class="box wide">
    <h2>Esteira de hoje</h2>
    <div class="pipe">
      <div class="st"><b id="n_fila">0</b><span>na fila</span></div>
      <div class="st on"><b id="n_brief">0</b><span>sendo escritos</span></div>
      <div class="st ask"><b id="n_rev">0</b><span>esperando você</span></div>
      <div class="st"><b id="n_apr">0</b><span>aprovados · projeto</span></div>
      <div class="st"><b id="n_prod">0</b><span>em produção</span></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="leg"><span><i style="background:#2A313C"></i>fila</span><span><i style="background:var(--blue)"></i>escrevendo</span><span><i style="background:var(--warn)"></i>revisão (você)</span><span><i style="background:var(--ok)"></i>aprovado</span><span><i style="background:#8B5CF6"></i>produção</span><span class="muted" id="hoje"></span></div>
  </section>
  <section class="box">
    <h2>Quem está fazendo o quê</h2>
    <div id="agentes"></div>
  </section>
  <section class="box">
    <h2>Saíram agora do Copy</h2>
    <div id="recentes"></div>
  </section>
  <section class="box wide">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </section>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const token = localStorage.getItem('esteira.token');
  if (!token) { $('#err').hidden = false; $('#err').textContent = 'Faça login no app Criativos primeiro (o token fica no navegador).'; }
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const minAgo = (iso) => iso ? Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)) : null;
  const hhmm = (iso) => { if (!iso) return '—'; if (/^\d\d:\d\d/.test(iso)) return iso; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
  const chip = (v) => { const k = { hook_visual: 'hv', hook_falado: 'hf', body: 'body', angulo: 'angulo' }[v] || ''; const n = { hook_visual: 'hook visual', hook_falado: 'copy nova', body: 'body novo', angulo: 'ângulo novo', execucao: 'execução', formato: 'formato', avatar: 'avatar', mecanismo: 'mecanismo' }[v] || v || '—'; return `<span class="chip ${k}">${esc(n)}</span>`; };
  const vistos = new Set(); let primeira = true;
  async function tick() {
    try {
      const r = await fetch('/api/cr/agentes', { headers: { authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || r.status);
      const d = await r.json();
      $('#main').hidden = false; $('#err').hidden = true;
      $('#hora').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR') + ' · a cada 10 s';
      const s = d.porStatus; $('#n_fila').textContent = s.fila; $('#n_brief').textContent = s.briefing; $('#n_rev').textContent = s.revisao; $('#n_apr').textContent = s.aprovado; $('#n_prod').textContent = s.producao;
      const tot = s.fila + s.briefing + s.revisao + s.aprovado + s.producao || 1;
      $('#bar').innerHTML = [['f', s.fila], ['b', s.briefing], ['r', s.revisao], ['a', s.aprovado], ['p', s.producao]].map(([k, n]) => `<i class="${k}" style="width:${(n / tot * 100).toFixed(1)}%" title="${n}"></i>`).join('');
      $('#hoje').textContent = `hoje: ${d.hoje.escritos} escritos${d.hoje.notaMedia ? ' · nota média ' + d.hoje.notaMedia : ''} · ${d.hoje.aprovados} aprovados`;
      $('#agentes').innerHTML = d.agentes.map((a) => {
        let w = '';
        if (Array.isArray(a.fazendo) && a.fazendo.length) w = a.fazendo.slice(0, 4).map((f) => typeof f === 'string' ? `<b>${esc(f)}</b>` : `<b>${esc(f.id)}</b> ${f.variavel ? chip(f.variavel) : ''} <span class="typing"><i></i><i></i><i></i></span> <span class="muted">${minAgo(f.desde) ?? '?'} min</span>`).join('<br>') + (a.fazendo.length > 4 ? `<br><span class="muted">+${a.fazendo.length - 4}</span>` : '');
        else if (a.fila) w = `<span class="muted">parado · ${a.fila} na fila</span>`;
        else w = `<span class="muted">${a.ultima?.resumo ? esc(a.ultima.resumo).slice(0, 90) : 'nada pendente'}</span>`;
        return `<div class="ag"><div class="dot ${a.ativo ? 'on' : ''}"></div><div class="n">${esc(a.nome)}<small>${a.fila != null ? 'fila ' + a.fila : ''}</small></div><div class="w">${w}</div><div class="t">última ${hhmm(a.ultima?.em)}<br>próxima ${esc(hhmm(a.proxima))}</div></div>`;
      }).join('');
      $('#recentes').innerHTML = (d.recentes || []).map((c) => `<div class="rec"><div><div class="id">${esc(c.id)}</div><div class="hk">${esc(c.hook || '')}</div></div><div>${chip(c.variavel)}<div class="muted" style="font-size:11px;margin-top:3px">${c.paiId ? 'pai ' + esc(c.paiId) : ''} · ${esc(c.status)} · ${hhmm(c.em)}</div></div><div class="nota ${c.score >= 8 ? 'g' : c.score >= 6 ? 'y' : 'r'}">${c.score ?? '–'}</div></div>`).join('') || '<span class="muted">nada ainda</span>';
      $('#log').innerHTML = (d.log || []).map((l) => { const k = l.em + l.resumo; const novo = !primeira && !vistos.has(k); vistos.add(k); return `<div class="${novo ? 'new' : ''}">${hhmm(l.em)} · <b>${esc(l.tipo)}</b> · ${esc(l.resumo)}</div>`; }).join('');
      primeira = false;
    } catch (e) { $('#err').hidden = false; $('#err').textContent = 'Erro: ' + e.message; }
  }
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
